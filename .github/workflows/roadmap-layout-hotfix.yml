name: One-time roadmap layout hotfix

on:
  push:
    paths:
      - '.github/workflows/roadmap-layout-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time roadmap layout hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch layout and overview zoom
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ("function semY(sem){ return 23.5 - SEMS.indexOf(sem)*6.8; }", "function semY(sem){ return 35 - SEMS.indexOf(sem)*10.0; }"),
            ("camera=new THREE.PerspectiveCamera(42,1,.1,250); camera.position.set(0,3.8,64);", "camera=new THREE.PerspectiveCamera(58,1,.1,400); camera.position.set(0,2.5,215);"),
            ("if(activeTrack==='all') return {product:-34,ux:-12,space:12,mobility:34}[track];", "if(activeTrack==='all') return {product:-30,ux:-10,space:10,mobility:30}[track];"),
            ("out[id]=new THREE.Vector3(base, semY(sem)+(i-(bucket.core.length-1)/2)*4.3, semZ(sem));", "out[id]=new THREE.Vector3(base, semY(sem)+(i-(bucket.core.length-1)/2)*5.2, semZ(sem));"),
            ("const spread=activeTrack==='all'?11.0:14.0;", "const spread=activeTrack==='all'?10.0:11.5;"),
            ("} else if(isSelTrack){ node.targetOpacity=node.role==='core'?1:.78; node.targetScale=node.role==='core'?1.08:.98; } else {", "} else if(isSelTrack){ node.targetOpacity=node.role==='core'?1:.38; node.targetScale=node.role==='core'?1.08:.86; } else {"),
            ("setOverview(); renderGrid(); updateTargets(); }));", "setOverview(); renderGrid(); updateTargets(); if(camera){ camera.position.z=activeTrack==='all'?215:102; camera.fov=activeTrack==='all'?58:42; camera.updateProjectionMatrix(); } }));")
          ]
          missing=[]
          for a,b in reps:
              if a not in s: missing.append(a[:140])
              else: s=s.replace(a,b,1)
          css_old=""".sceneWrap{min-height:700px;background:radial-gradient(circle at 50% 16%,rgba(40,88,124,.42),transparent 34%),linear-gradient(180deg,#09111d,#050912)}\ncanvas{height:700px}"""
          css_new=""".sceneWrap{min-height:800px;background:radial-gradient(circle at 50% 16%,rgba(40,88,124,.42),transparent 34%),linear-gradient(180deg,#09111d,#050912)}\ncanvas{height:800px}"""
          if css_old not in s: missing.append('desktop hotfix height block')
          else: s=s.replace(css_old,css_new,1)
          s=s.replace('.sceneWrap{min-height:720px}\n  canvas{height:720px;width:calc(100% - 94px);margin-left:94px}', '.sceneWrap{min-height:800px}\n  canvas{height:800px;width:calc(100% - 94px);margin-left:94px}',1)
          s=s.replace('.sceneWrap{min-height:700px}\n  canvas{height:700px;width:calc(100% - 90px);margin-left:90px}', '.sceneWrap{min-height:800px}\n  canvas{height:800px;width:calc(100% - 90px);margin-left:90px}',1)
          if missing:
              raise SystemExit('missing anchors:\n'+'\n'.join(missing))
          p.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          git diff --check
          grep -q "SEMS.indexOf(sem)\*10.0" index.html
          grep -q "activeTrack==='all'?215:102" index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate semester cards and fit all tracks in overview"
          git push
