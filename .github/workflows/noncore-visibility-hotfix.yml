name: Noncore visibility hotfix

on:
  push:
    paths:
      - '.github/workflows/noncore-visibility-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch roadmap visibility and selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- noncore-visibility-fix-2026-08-25 -->'
          if marker in text:
              print('Patch already applied')
              sys.exit(0)

          def must_replace(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              text = text.replace(old, new, 1)

          def must_sub(pattern, repl, label, flags=0):
              global text
              new_text, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'expected one match for {label}, got {n}')
              text = new_text

          # Non-core courses use one neutral light-gray visual language.
          must_replace(
              "const COLORS={common:'#20f4ff',product:'#ff43ce',ux:'#baff39',space:'#ff9f38',mobility:'#9a78ff'};",
              "const COLORS={common:'#d7dde8',neutral:'#d7dde8',product:'#ff43ce',ux:'#baff39',space:'#ff9f38',mobility:'#9a78ff'};",
              'COLORS'
          )
          must_replace(
              '<div style="color:var(--cyan)"><i></i>공통 기반</div>',
              '<div style="color:#d7dde8"><i></i>공통 · 확장 과목</div>',
              'legend'
          )

          # Grid: foundation/support are gray; pass role so an exact scene instance can be selected.
          must_sub(
              r"function renderGrid\(\)\{.*?\nfunction showCourse",
              '''function renderGrid(){ const grouped=groupedForTrack(activeTrack); semGrid.innerHTML=''; SEMS.forEach(sem=>{ const col=document.createElement('section'); col.className='semCol'; col.innerHTML=`<h4>${sem.replace('-','학년 ')}학기</h4>`; const data=grouped[sem]; const add=(title,list,color,role)=>{ if(!list.length) return; const lab=document.createElement('div'); lab.className='groupTitle'; lab.textContent=title; col.appendChild(lab); list.forEach(c=>{ const b=document.createElement('button'); b.type='button'; b.className='courseBtn'; b.style.setProperty('--c',color); if(role!=='core'){ b.style.background='#d7dde8'; b.style.color='#111722'; b.style.borderColor='#eef1f5'; } b.innerHTML=`<strong>${c.n}</strong><small style="${role!=='core'?'color:#4c5668':''}">${c.k.join(' · ')}</small>`; b.addEventListener('click',()=>showCourse(c, role==='foundation'?'common':activeTrack, role)); col.appendChild(b); }); }; add('Foundation', data.foundation, COLORS.neutral, 'foundation'); if(activeTrack==='all'){ const note=document.createElement('div'); note.style.cssText='color:#7a879f;font-size:12px;line-height:1.6;padding:6px 2px 2px'; note.textContent='트랙을 선택하면 해당 트랙의 Core와 모든 확장 과목을 겹침 없이 표시합니다.'; col.appendChild(note); } else { add('Core branch', data.core, COLORS[activeTrack], 'core'); add('Extended base', data.support, COLORS.neutral, 'support'); } semGrid.appendChild(col); }); }
function showCourse''',
              'renderGrid',
              re.S
          )

          must_sub(
              r"function showCourse\(course, trackHint\)\{.*?\n(?=document\.querySelectorAll\('\.trackBtn'\))",
              '''function showCourse(course, trackHint, role='support'){ selectedNode={course, track:trackHint, role}; chips.innerHTML=`<span class="chip">${course.s.replace('-','학년 ')}학기</span><span class="chip">${trackHint==='common'?'공통 기반':TRACKS[trackHint].label}</span><span class="chip">${role==='core'?'Core':role==='foundation'?'Foundation':'Extended base'}</span>`; detailTitle.textContent=course.n; detailDesc.textContent=course.d; keywordList.innerHTML=course.k.map(v=>`<span class="badge2">${v}</span>`).join(''); pathNote.textContent=(trackHint && trackHint!=='common' && trackHint!=='all')?`${TRACKS[trackHint].label} 브랜치 안의 이 과목만 강조됩니다. 같은 과목이 다른 트랙에도 연결되어 있어도 다른 박스가 함께 선택되지는 않습니다.`:'공통 기반 과목은 모든 브랜치와 연결되는 밝은 회색 노드로 표시됩니다.'; updateTargets(); }
''',
              'showCourse',
              re.S
          )

          # Keep overview zoom, but give a selected track enough width to show every support card.
          must_sub(
              r"document\.querySelectorAll\('\.trackBtn'\)\.forEach\(btn=>btn\.addEventListener\('click',.*?\n(?=let THREE)",
              "document.querySelectorAll('.trackBtn').forEach(btn=>btn.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); activeTrack=btn.dataset.track; selectedNode=null; sceneOffsetTarget=0; document.querySelectorAll('.trackBtn').forEach(b=>{ const on=b===btn; b.classList.toggle('active',on); b.setAttribute('aria-pressed',on?'true':'false'); }); setOverview(); renderGrid(); updateTargets(); if(camera){ camera.position.z=activeTrack==='all'?215:126; camera.fov=activeTrack==='all'?58:44; camera.updateProjectionMatrix(); } }));\n",
              'track button handler',
              re.S
          )

          # Bright-gray cards for every non-core node. Disable depth testing so a card cannot disappear behind another 3D layer.
          must_sub(
              r"function labelTexture\(text, color, core=false, foundation=false\)\{.*?\n(?=function createNode)",
              '''function labelTexture(text, color, core=false, foundation=false){ const cv=document.createElement('canvas'); cv.width=960; cv.height=252; const x=cv.getContext('2d'); const neutral=!core; const border=core?color:'#f2f4f7'; x.fillStyle=neutral?'rgba(215,221,232,.99)':'rgba(18,28,44,.99)'; x.strokeStyle=border; x.lineWidth=core?10:7; x.shadowColor=core?border:'rgba(255,255,255,.45)'; x.shadowBlur=core?40:12; x.beginPath(); x.roundRect(10,10,940,232,24); x.fill(); x.stroke(); x.shadowBlur=0; x.fillStyle=neutral?'#101621':'#ffffff'; x.textAlign='center'; x.textBaseline='middle'; const font1=core?58:52; const font2=core?50:44; x.font=`800 ${font1}px sans-serif`; const max=760; let lines=[text]; if(x.measureText(text).width>max){ let split=Math.ceil(text.length/2); const near=text.lastIndexOf(' ', split); if(near>0) split=near; lines=[text.slice(0,split), text.slice(split).trim()]; } if(lines.length===1){ x.fillText(lines[0],480,126,max); } else { x.font=`800 ${font2}px sans-serif`; x.fillText(lines[0],480,102,max+40); x.fillText(lines[1],480,154,max+40); } const sub=foundation?'FOUNDATION':(core?'CORE BRANCH':'EXTENDED BASE'); x.fillStyle=neutral?'#596274':'rgba(220,230,246,.96)'; x.font='800 22px sans-serif'; x.fillText(sub,480,210,760); const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t; }
''',
              'labelTexture',
              re.S
          )

          must_sub(
              r"function createNode\(course, opts\)\{.*?\n(?=function buildScene)",
              '''function createNode(course, opts){ const group=new THREE.Group(); const shadow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture('#000000'),transparent:true,depthTest:false,depthWrite:false,opacity:.12})); shadow.scale.set(opts.foundation?12.5:(opts.core?14:12), opts.foundation?3.4:(opts.core?4.0:3.4),1); shadow.position.z=-0.3; group.add(shadow); const haloColor=opts.core?opts.color:COLORS.neutral; const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(haloColor),transparent:true,depthTest:false,depthWrite:false,opacity:0})); halo.scale.set(opts.foundation?14.2:(opts.core?15.5:13.5), opts.foundation?4.2:(opts.core?4.8:4.2),1); group.add(halo); const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTexture(course.n,opts.color,opts.core,opts.foundation),transparent:true,depthTest:false,depthWrite:false,opacity:1})); sprite.scale.set(opts.foundation?13.2:(opts.core?15.0:13.2), opts.foundation?3.6:(opts.core?4.15:3.6),1); sprite.renderOrder=10; group.add(sprite); group.userData.course=course; group.userData.track=opts.track||'common'; group.userData.role=opts.foundation?'foundation':opts.role; nodeRegistry.push({track:opts.track||'common',role:opts.foundation?'foundation':opts.role,course,group,sprite,halo,shadow,current:new THREE.Vector3(),target:new THREE.Vector3(),opacity:0,targetOpacity:1,scale:1,targetScale:1}); return group; }
''',
              'createNode',
              re.S
          )

          # Build neutral support nodes/lines while preserving the current low-memory renderer settings.
          must_replace(
              "FOUNDATION.forEach(id=>rootGroup.add(createNode(courseMap[id],{foundation:true,color:COLORS.common})));",
              "FOUNDATION.forEach(id=>rootGroup.add(createNode(courseMap[id],{foundation:true,color:COLORS.neutral})));",
              'foundation node color'
          )
          must_replace(
              "TRACKS[track].support.forEach(id=>rootGroup.add(createNode(courseMap[id],{track,role:'support',core:false,color:TRACKS[track].color})));",
              "TRACKS[track].support.forEach(id=>rootGroup.add(createNode(courseMap[id],{track,role:'support',core:false,color:COLORS.neutral})));",
              'support node color'
          )
          must_replace(
              "new THREE.LineBasicMaterial({color:TRACKS[track].color,transparent:true,opacity:.28})",
              "new THREE.LineBasicMaterial({color:0xaeb6c3,transparent:true,opacity:.48,depthTest:false})",
              'support line material'
          )

          # Spread support cards into fixed side slots. No card shares the core card's screen footprint.
          must_sub(
              r"function trackPosMap\(track\)\{.*?\n(?=function updateTargets)",
              '''function trackPosMap(track){ const base=trackBase(track); const config=TRACKS[track]; const out={}; const buckets={}; config.core.forEach(id=>{ const s=courseMap[id].s; (buckets[s]||(buckets[s]={core:[],support:[]})).core.push(id); }); config.support.forEach(id=>{ const s=courseMap[id].s; (buckets[s]||(buckets[s]={core:[],support:[]})).support.push(id); }); SEMS.forEach(sem=>{ const bucket=buckets[sem]||{core:[],support:[]}; bucket.core.forEach((id,i)=>{ const gap=bucket.core.length>1?5.3:0; out[id]=new THREE.Vector3(base, semY(sem)+(i-(bucket.core.length-1)/2)*gap, semZ(sem)); }); const slots=[[-14.5,-2.15],[14.5,2.15],[-14.5,2.15],[14.5,-2.15]]; bucket.support.forEach((id,i)=>{ const slot=slots[i]||[(i%2?-14.5:14.5),(Math.floor(i/2)+1)*2.2]; const spread=activeTrack==='all'?1.05:1; out[id]=new THREE.Vector3(base+slot[0]*spread, semY(sem)+slot[1], semZ(sem)+0.8); }); }); return out; }
''',
              'trackPosMap',
              re.S
          )

          # All support cards in the selected track are fully visible. Selection is track+role+course, not course id alone.
          must_sub(
              r"function updateTargets\(initial=false\)\{.*?\n(?=function updateLines)",
              '''function updateTargets(initial=false){ if(!selectedNode) setOverview(); const posByTrack={}; TRACK_ORDER.forEach(t=>posByTrack[t]=trackPosMap(t)); nodeRegistry.forEach(node=>{ if(node.role==='foundation'){ node.target.copy(foundationPos(node.course)); node.targetOpacity=1; node.targetScale=1; } else { node.target.copy(posByTrack[node.track][node.course.id]); const isSelTrack=activeTrack===node.track; if(activeTrack==='all'){ node.targetOpacity=node.role==='core'?1:0; node.targetScale=node.role==='core'?1:.92; } else if(isSelTrack){ node.targetOpacity=1; node.targetScale=node.role==='core'?1.06:.96; } else { node.targetOpacity=0; node.targetScale=.84; } const selected=selectedNode && selectedNode.course.id===node.course.id && selectedNode.track===node.track && selectedNode.role===node.role; if(selected){ node.targetOpacity=1; node.targetScale=node.role==='core'?1.13:1.06; } } if(initial){ node.current.copy(node.target); node.opacity=node.targetOpacity; node.scale=node.targetScale; } }); }
''',
              'updateTargets',
              re.S
          )

          must_replace(
              "branchLines[track].supportLine.material.opacity=.3;",
              "branchLines[track].supportLine.material.opacity=.62;",
              'support line opacity'
          )
          must_replace(
              "const selected=selectedNode && selectedNode.course.id===n.course.id;",
              "const selected=selectedNode && selectedNode.course.id===n.course.id && selectedNode.track===n.track && selectedNode.role===n.role;",
              'animate selection key'
          )
          must_replace(
              "showCourse(p.userData.course,p.userData.track);",
              "showCourse(p.userData.course,p.userData.track,p.userData.role);",
              'raycast role'
          )

          # Do not raycast invisible nodes.
          text = text.replace(
              "raycaster.intersectObjects(nodeRegistry.map(n=>n.sprite))",
              "raycaster.intersectObjects(nodeRegistry.filter(n=>n.opacity>.2).map(n=>n.sprite))"
          )

          text = text.replace('</head>', marker + '\n</head>', 1)
          p.write_text(text, encoding='utf-8')
          print('index.html patched')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Show all subcourses and isolate course selection"
            git push origin HEAD:main
          fi
